<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Operation Guide</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111;
    color: #eee;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #1a1a1a; }
  header { padding: 16px; border-bottom: 1px solid #333; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; color: #999; font-size: 14px; }
  video { width: 100%; display: block; background: #000; max-height: 60vh; }
  .placeholder {
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #222;
    color: #999;
    text-align: center;
    padding: 24px;
    font-size: 15px;
  }
  section { padding: 16px; border-bottom: 1px solid #333; }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #999;
    margin: 0 0 8px;
  }
  section p { margin: 0; line-height: 1.5; white-space: pre-wrap; }
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .photos img { width: 100%; border-radius: 4px; display: block; }
  .state { padding: 60px 20px; text-align: center; color: #999; font-size: 15px; }
</style>
</head>
<body>
<div id="app"><div class="state">Loading...</div></div>
<script>
  var id = location.pathname.split('/').filter(Boolean).pop();

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function render(app, op) {
    var videoBlock = op.video_url
      ? '<video src="' + op.video_url + '" controls playsinline></video>'
      : '<div class="placeholder">Video not recorded yet &mdash; ask your supervisor.</div>';

    var notecardBlock = op.notecard_text
      ? '<section><h2>Notes</h2><p>' + escapeHtml(op.notecard_text) + '</p></section>'
      : '';

    var defectBlock = op.defect_notes
      ? '<section><h2>Defect Notes</h2><p>' + escapeHtml(op.defect_notes) + '</p></section>'
      : '';

    var photosBlock = (op.defect_photo_urls && op.defect_photo_urls.length)
      ? '<section><h2>Defect Photos</h2><div class="photos">' +
        op.defect_photo_urls.map(function (u) { return '<img src="' + u + '">'; }).join('') +
        '</div></section>'
      : '';

    app.innerHTML =
      '<header>' +
        '<h1>' + escapeHtml(op.element_name) + '</h1>' +
        '<p>' + escapeHtml(op.station_name || '') + '</p>' +
      '</header>' +
      videoBlock + notecardBlock + defectBlock + photosBlock;
  }

  function load() {
    var app = document.getElementById('app');
    fetch('/api/operations/' + id + '/view')
      .then(function (res) {
        if (res.status === 404) {
          app.innerHTML = '<div class="state">This operation could not be found. Ask your supervisor.</div>';
          return null;
        }
        if (!res.ok) throw new Error('Server error');
        return res.json();
      })
      .then(function (op) {
        if (op) render(app, op);
      })
      .catch(function () {
        app.innerHTML = '<div class="state">Could not load this operation. Check your connection and try again.</div>';
      });
  }

  load();
</script>
</body>
</html>
